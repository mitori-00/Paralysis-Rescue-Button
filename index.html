<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Notion ADHD Fidget Deck (Web Notion Dark Mode Ready)</title>
<style>
  :root {
    --bg-color: transparent;
    --rescue-bg: #C76B1E;
    --rescue-hover: #B55F18;
    --rescue-ring: #C76B1E;
    --focus-bg: #2E7399;
    --focus-hover: #266487;
    --focus-ring: #2E7399;
    --rest-bg: #2B7A6C;
    --rest-hover: #23695C;
    --rest-ring: #2B7A6C;
    --toggle-dot: rgba(55, 53, 47, 0.22);
  }

  /* 다크모드 클래스가 적용되거나 OS가 다크모드일 때 */
  html.dark,
  body.dark {
    --bg-color: #191919;
    --rescue-bg: #C97630;
    --rescue-hover: #D6833D;
    --rescue-ring: #E3924D;
    --focus-bg: #3E84AB;
    --focus-hover: #4A91B8;
    --focus-ring: #5BA1C7;
    --rest-bg: #3A8A7B;
    --rest-hover: #469687;
    --rest-ring: #57A899;
    --toggle-dot: rgba(255, 255, 255, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root:not(.light) {
      --bg-color: #191919;
      --rescue-bg: #C97630;
      --rescue-hover: #D6833D;
      --rescue-ring: #E3924D;
      --focus-bg: #3E84AB;
      --focus-hover: #4A91B8;
      --focus-ring: #5BA1C7;
      --rest-bg: #3A8A7B;
      --rest-hover: #469687;
      --rest-ring: #57A899;
      --toggle-dot: rgba(255, 255, 255, 0.25);
    }
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-color) !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    transition: background-color 0.2s ease;
  }

  body {
    padding: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    position: relative;
  }

  /* 기본(PC/태블릿): 가로 1줄 배치 */
  .fidget-deck {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 560px;
  }

  /* 플랫 노션 버튼 스타일 + 탄성 있는 클릭 트랜지션 */
  .key-btn {
    position: relative;
    height: 52px;
    border: none;
    border-radius: 8px;
    color: #FFFFFF;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    touch-action: manipulation;
    transition: background-color 0.12s ease,
                transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                filter 0.12s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    padding: 0 12px;
  }

  /* 클릭 시 꾹 들어가는 확실한 타격감 */
  .key-btn:active,
  .key-btn.pressed {
    transform: scale(0.92) translateY(2px);
    filter: brightness(1.12);
    transition: transform 0.05s ease-out, filter 0.05s ease-out;
  }

  /* 클릭 순간 외곽으로 퍼지는 파동 링 */
  .key-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 8px;
    border: 2px solid currentColor;
    opacity: 0;
    pointer-events: none;
  }

  .key-btn.pulse::after {
    animation: clickRipple 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes clickRipple {
    0% {
      transform: scale(0.96);
      opacity: 0.65;
    }
    100% {
      transform: scale(1.08, 1.18);
      opacity: 0;
    }
  }

  /* 1. 오렌지 */
  .btn-rescue { background-color: var(--rescue-bg); }
  .btn-rescue:hover { background-color: var(--rescue-hover); }
  .btn-rescue::after { border-color: var(--rescue-ring); }

  /* 2. 블루 */
  .btn-focus { background-color: var(--focus-bg); }
  .btn-focus:hover { background-color: var(--focus-hover); }
  .btn-focus::after { border-color: var(--focus-ring); }

  /* 3. 그린 */
  .btn-rest { background-color: var(--rest-bg); }
  .btn-rest:hover { background-color: var(--rest-hover); }
  .btn-rest::after { border-color: var(--rest-ring); }

  .main-label {
    font-size: 13px;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .sub-label {
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    opacity: 0.85;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* 우측 하단 초소형 수동 테마 전환 도트 (호버 시에만 선명해짐) */
  .theme-dot {
    position: fixed;
    bottom: 6px;
    right: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: none;
    background-color: var(--toggle-dot);
    cursor: pointer;
    padding: 0;
    opacity: 0.4;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .theme-dot:hover {
    opacity: 1;
    transform: scale(1.3);
  }

  /* 모바일 대응 */
  @media (max-width: 480px) {
    body { padding: 10px; }
    .fidget-deck {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-rescue {
      grid-column: 1 / -1;
      height: 50px;
    }
    .btn-focus, .btn-rest {
      height: 48px;
    }
    .main-label { font-size: 12.5px; }
    .sub-label { font-size: 9px; }
  }
</style>
</head>
<body>

  <div class="fidget-deck">
    <button class="key-btn btn-rescue" id="rescueBtn" aria-label="Paralysis Rescue">
      <span class="main-label">🚨 RESCUE</span>
      <span class="sub-label">Unfreeze [Space]</span>
    </button>

    <button class="key-btn btn-focus" id="focusBtn" aria-label="One Tiny Step">
      <span class="main-label">⚡ TINY STEP</span>
      <span class="sub-label">5 mins [Enter]</span>
    </button>

    <button class="key-btn btn-rest" id="restBtn" aria-label="Brain Reset">
      <span class="main-label">🌿 BREATHE</span>
      <span class="sub-label">Rest [Esc]</span>
    </button>
  </div>

  <!-- 수동 테마 전환 도트 (클릭 시 라이트/다크 즉시 토글) -->
  <button class="theme-dot" id="themeToggle" title="Toggle Dark/Light Mode" aria-label="Toggle Theme"></button>

  <script>
    // 1. URL 파라미터(?theme=dark 또는 ?theme=light) 및 저장된 테마 확인
    const urlParams = new URLSearchParams(window.location.search);
    const paramTheme = urlParams.get('theme');
    const savedTheme = localStorage.getItem('fidget-deck-theme');
    const rootEl = document.documentElement;

    function applyTheme(mode) {
      rootEl.classList.remove('dark', 'light');
      if (mode === 'dark') {
        rootEl.classList.add('dark');
      } else if (mode === 'light') {
        rootEl.classList.add('light');
      }
    }

    if (paramTheme === 'dark' || paramTheme === 'light') {
      applyTheme(paramTheme);
    } else if (savedTheme) {
      applyTheme(savedTheme);
    }

    // 2. 수동 테마 전환 도트 클릭 이벤트
    document.getElementById('themeToggle').addEventListener('click', () => {
      const isCurrentlyDark = rootEl.classList.contains('dark') ||
        (!rootEl.classList.contains('light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const nextTheme = isCurrentlyDark ? 'light' : 'dark';
      applyTheme(nextTheme);
      localStorage.setItem('fidget-deck-theme', nextTheme);
    });

    // 3. 버튼 클릭 & 키보드 피젯 로직
    const buttons = [
      { el: document.getElementById('rescueBtn'), code: 'Space' },
      { el: document.getElementById('focusBtn'), code: 'Enter' },
      { el: document.getElementById('restBtn'), code: 'Escape' }
    ];

    function triggerFeedback(el) {
      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }

    buttons.forEach(({ el }) => {
      el.addEventListener('pointerdown', () => {
        el.classList.add('pressed');
        triggerFeedback(el);
      });
      el.addEventListener('pointerup', () => el.classList.remove('pressed'));
      el.addEventListener('pointerleave', () => el.classList.remove('pressed'));
      el.addEventListener('pointercancel', () => el.classList.remove('pressed'));
    });

    window.addEventListener('keydown', (e) => {
      const target = buttons.find(b => b.code === e.code);
      if (target && !e.repeat) {
        e.preventDefault();
        target.el.classList.add('pressed');
        triggerFeedback(target.el);
      }
    });

    window.addEventListener('keyup', (e) => {
      const target = buttons.find(b => b.code === e.code);
      if (target) {
        target.el.classList.remove('pressed');
      }
    });
  </script>

</body>
</html>
