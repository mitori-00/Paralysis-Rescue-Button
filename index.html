<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Fidget Spacebar</title>
<style>
  /* 노션 임베드 시 여백 제거 및 배경 투명화 */
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* 3D 매트 아이콘 톤을 재현한 스페이스바 디자인 */
  .spacebar-btn {
    position: relative;
    width: 100%;
    max-width: 340px;
    height: 68px;
    /* 노션 차분한 오렌지 & 부드러운 매트 그라데이션 */
    background: linear-gradient(180deg, #E38B36 0%, #D9730D 100%);
    border: none;
    border-radius: 16px;
    /* 하단 그레이 베이스와 입체 그림자 (아이콘과 동일 컬러) */
    box-shadow: 
      0 9px 0 #37352F, 
      0 14px 20px rgba(0, 0, 0, 0.16),
      inset 0 2px 2px rgba(255, 255, 255, 0.35);
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    outline: none;
    transition: transform 0.06s cubic-bezier(0.34, 1.56, 0.64, 1), 
                box-shadow 0.06s cubic-bezier(0.34, 1.56, 0.64, 1),
                background 0.1s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 3px;
  }

  /* 마우스 올렸을 때 살짝 밝아지는 반응 */
  .spacebar-btn:hover {
    background: linear-gradient(180deg, #E99645 0%, #DF7B17 100%);
  }

  /* 클릭(또는 스페이스바 누름) 시 쏙 들어가는 3D 키캡 효과 */
  .spacebar-btn:active,
  .spacebar-btn.pressed {
    transform: translateY(7px);
    box-shadow: 
      0 2px 0 #37352F, 
      0 4px 8px rgba(0, 0, 0, 0.15),
      inset 0 1px 2px rgba(255, 255, 255, 0.2);
  }

  .main-label {
    display: flex;
    align-items: center;
    gap: 8px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
  }

  .sub-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    opacity: 0.85;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <button class="spacebar-btn" id="rescueBtn" aria-label="Paralysis Rescue Button">
    <span class="main-label">🚨 PARALYSIS RESCUE</span>
    <span class="sub-label">Press to unfreeze</span>
  </button>

  <script>
    const btn = document.getElementById('rescueBtn');

    // 키보드 실제 스페이스바를 눌러도 동일하게 눌리는 디테일 추가
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        btn.classList.add('pressed');
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        btn.classList.remove('pressed');
      }
    });
  </script>

</body>
</html>
