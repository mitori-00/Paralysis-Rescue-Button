<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Notion ADHD Fidget Deck (Flat & Muted)</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 투명 배경 기본 및 다크모드 대응 */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent !important;
    background-color: transparent !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  body {
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  @media (prefers-color-scheme: dark) {
    html, body {
      background-color: #191919 !important;
    }
  }

  /* 기본(PC/태블릿): 가로 1줄 배치 */
  .fidget-deck {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 560px;
  }

  /* Brain Dump Zone과 통일된 플랫(Flat) 노션 버튼 스타일 */
  .key-btn {
    height: 52px;
    border: none;
    border-radius: 8px;
    color: #FFFFFF;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    touch-action: manipulation;
    transition: background-color 0.15s ease, transform 0.08s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    padding: 0 12px;
  }

  .key-btn:active,
  .key-btn.pressed {
    transform: scale(0.98);
  }

  /* 1. 오렌지: 차분한 노션 테라코타 오렌지 */
  .btn-rescue {
    background-color: #C76B1E;
  }
  .btn-rescue:hover {
    background-color: #B55F18;
  }
  .btn-rescue:active,
  .btn-rescue.pressed {
    background-color: #A15313;
  }

  /* 2. 블루: 차분한 노션 슬레이트 블루 */
  .btn-focus {
    background-color: #2E7399;
  }
  .btn-focus:hover {
    background-color: #266487;
  }
  .btn-focus:active,
  .btn-focus.pressed {
    background-color: #1F5574;
  }

  /* 3. 그린: 차분한 노션 세이지 그린 */
  .btn-rest {
    background-color: #2B7A6C;
  }
  .btn-rest:hover {
    background-color: #23695C;
  }
  .btn-rest:active,
  .btn-rest.pressed {
    background-color: #1C584D;
  }

  /* 🌙 노션 다크모드 전용 뮤트 컬러 보정 */
  @media (prefers-color-scheme: dark) {
    .btn-rescue {
      background-color: #C97630;
    }
    .btn-rescue:hover {
      background-color: #D6833D;
    }
    .btn-rescue:active,
    .btn-rescue.pressed {
      background-color: #B56725;
    }

    .btn-focus {
      background-color: #3E84AB;
    }
    .btn-focus:hover {
      background-color: #4A91B8;
    }
    .btn-focus:active,
    .btn-focus.pressed {
      background-color: #337499;
    }

    .btn-rest {
      background-color: #3A8A7B;
    }
    .btn-rest:hover {
      background-color: #469687;
    }
    .btn-rest:active,
    .btn-rest.pressed {
      background-color: #2F786A;
    }
  }

  .main-label {
    font-size: 13px;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .sub-label {
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    opacity: 0.85;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* 모바일 대응 */
  @media (max-width: 480px) {
    body { padding: 8px; }
    .fidget-deck {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-rescue {
      grid-column: 1 / -1;
      height: 50px;
    }
    .btn-focus, .btn-rest {
      height: 48px;
    }
    .main-label { font-size: 12.5px; }
    .sub-label { font-size: 9px; }
  }
</style>
</head>
<body>

  <div class="fidget-deck">
    <button class="key-btn btn-rescue" id="rescueBtn" aria-label="Paralysis Rescue">
      <span class="main-label">🚨 RESCUE</span>
      <span class="sub-label">Unfreeze [Space]</span>
    </button>

    <button class="key-btn btn-focus" id="focusBtn" aria-label="One Tiny Step">
      <span class="main-label">⚡ TINY STEP</span>
      <span class="sub-label">5 mins [Enter]</span>
    </button>

    <button class="key-btn btn-rest" id="restBtn" aria-label="Brain Reset">
      <span class="main-label">🌿 BREATHE</span>
      <span class="sub-label">Rest [Esc]</span>
    </button>
  </div>

  <script>
    const buttons = [
      { el: document.getElementById('rescueBtn'), code: 'Space' },
      { el: document.getElementById('focusBtn'), code: 'Enter' },
      { el: document.getElementById('restBtn'), code: 'Escape' }
    ];

    buttons.forEach(({ el }) => {
      el.addEventListener('touchstart', () => el.classList.add('pressed'), { passive: true });
      el.addEventListener('touchend', () => el.classList.remove('pressed'));
      el.addEventListener('touchcancel', () => el.classList.remove('pressed'));
    });

    window.addEventListener('keydown', (e) => {
      const target = buttons.find(b => b.code === e.code);
      if (target) {
        e.preventDefault();
        target.el.classList.add('pressed');
      }
    });

    window.addEventListener('keyup', (e) => {
      const target = buttons.find(b => b.code === e.code);
      if (target) {
        target.el.classList.remove('pressed');
      }
    });
  </script>

</body>
</html>
